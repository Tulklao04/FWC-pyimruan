<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            color: white;
            text-align: center;
            font-size: 3rem;
        }
        .shops-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
        }
        .shop-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .shop-item img {
            width: 250px;
            height: 150px;
            object-fit: contain;
            background-color: white;
            border-radius: 8px;
            padding: 10px;
        }
        .shop-item a {
            margin-top: 10px;
            font-size: 1.1rem;
            color: #333;
            text-decoration: underline;
        }
        hr {
            border: 0;
            height: 1px;
            background-color: #333;
            width: 100%;
        }
        .footer {
            text-align: right;
            font-family: monospace;
            font-style: italic;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1> Online Shops </h1>

    <div class="shops-container">
        <div class="shop-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon">
            <a href="https://www.amazon.com" target="_blank">Visit Amazon</a>
        </div>
        <div class="shop-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/EBay_logo.svg" alt="eBay">
            <a href="https://www.ebay.com" target="_blank">Visit eBay</a>
        </div>
    </div>

    <hr>

    <div class="footer">
        &copy; pyimruan 2026
    </div>
</body>
</html>
