<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            height: 150px;
            border-collapse: collapse;
            border: 2px solid #555;
        }
        td {
            width: 50%;
            border: 1px solid #777;
            padding: 15px;
            vertical-align: middle;
            font-family: sans-serif;
            font-size: 1.1rem;
        }
        .first-cell {
            background-color: #b8c87e;
        }
        .second-cell {
            background-color: #f7b79f;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="first-cell">First cell</td>
            <td class="second-cell">Second cell</td>
        </tr>
    </table>
</body>
</html>
