<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="card">
        <h1>User Profile Card</h1>
        <table class="profile-table">
            <tr>
                <td>
                    <img class="profile-img" src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=500" alt="Profile Picture">
                </td>
            </tr>
            <tr>
                <td class="login">pyimruan</td>
            </tr>
            <tr>
                <td class="desc">Student at 42</td>
            </tr>
            <tr>
                <td class="social-links">
                    <img src="https://cdn-icons-png.flaticon.com/512/1006/1006771.png" alt="web">
                    <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="twitter">
                    <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="linkedin">
                    <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="facebook">
                </td>
            </tr>
            <tr>
                <td>
                    <button class="contact-btn" type="button">Contact</button>
                </td>
            </tr>
        </table>
    </div>

</body>
</html>
